<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" style="max-width:400px;">
  <rect width="400" height="240" fill="#f0fdf4"/>
  <rect x="0" y="180" width="400" height="60" fill="#d4a373"/>
  
  <!-- Finish line -->
  <line x1="320" y1="40" x2="320" y2="180" stroke="#dc2626" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="320" y="35" font-family="sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="bold">FINISH</text>
  
  <!-- Dog (surprised at finish line) -->
  <ellipse cx="230" cy="130" rx="35" ry="20" fill="#78350f"/>
  <circle cx="260" cy="110" r="15" fill="#78350f"/>
  <polygon points="255,100 245,85 265,95" fill="#78350f"/>
  <polygon points="265,100 275,85 270,95" fill="#78350f"/>
  <circle cx="265" cy="108" r="2" fill="#fff"/>
  <rect x="195" y="140" width="8" height="20" fill="#78350f"/>
  <rect x="250" y="140" width="8" height="20" fill="#78350f"/>
  <polygon points="195,120 175,105 205,130" fill="#78350f"/>
  
  <!-- Tortoise (winner, at finish line) -->
  <ellipse cx="340" cy="150" rx="35" ry="22" fill="#166534"/>
  <path d="M 305 150 Q 340 105 375 150" fill="#15803d" stroke="#166534" stroke-width="2"/>
  <circle cx="378" cy="155" r="8" fill="#15803d"/>
  <circle cx="380" cy="152" r="1.5" fill="#000"/>
  <rect x="315" y="165" width="8" height="12" rx="3" fill="#15803d"/>
  <rect x="355" y="165" width="8" height="12" rx="3" fill="#15803d"/>
  
  <!-- Meat chunks on the path (dog's distraction) -->
  <circle cx="60" cy="160" r="4" fill="#92400e"/>
  <circle cx="110" cy="155" r="4" fill="#92400e"/>
  <circle cx="160" cy="165" r="4" fill="#92400e"/>
  
  <text x="200" y="225" font-family="sans-serif" font-size="11" fill="#444" text-anchor="middle">The tortoise wins the race!</text>
</svg>
