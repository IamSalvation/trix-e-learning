<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" style="max-width:400px;">
  <rect width="400" height="240" fill="#fef9c3"/>
  <rect x="0" y="180" width="400" height="60" fill="#d4a373"/>
  
  <!-- Sofa -->
  <rect x="220" y="140" width="100" height="60" rx="10" fill="#f43f5e"/>
  <rect x="230" y="130" width="80" height="20" rx="5" fill="#f43f5e"/>
  
  <!-- Father -->
  <circle cx="80" cy="110" r="18" fill="#78350f"/>
  <rect x="60" y="130" width="40" height="60" rx="6" fill="#0ea5e9"/>
  <rect x="60" y="190" width="15" height="30" fill="#1e293b"/>
  <rect x="85" y="190" width="15" height="30" fill="#1e293b"/>
  <text x="80" y="105" font-family="sans-serif" font-size="8" fill="#fff" text-anchor="middle">Dad</text>

  <!-- Mother -->
  <circle cx="180" cy="120" r="18" fill="#78350f"/>
  <rect x="160" y="140" width="40" height="55" rx="6" fill="#a855f7"/>
  <rect x="160" y="195" width="15" height="30" fill="#1e293b"/>
  <rect x="185" y="195" width="15" height="30" fill="#1e293b"/>
  <text x="180" y="115" font-family="sans-serif" font-size="8" fill="#fff" text-anchor="middle">Mum</text>

  <!-- Child (Ayo) -->
  <circle cx="320" cy="130" r="14" fill="#78350f"/>
  <rect x="306" y="145" width="28" height="45" rx="5" fill="#16a34a"/>
  <rect x="306" y="190" width="10" height="25" fill="#1e293b"/>
  <rect x="324" y="190" width="10" height="25" fill="#1e293b"/>
  <text x="320" y="125" font-family="sans-serif" font-size="8" fill="#fff" text-anchor="middle">Ayo</text>

  <text x="200" y="35" font-family="sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">Good Morning at Home</text>
</svg>
