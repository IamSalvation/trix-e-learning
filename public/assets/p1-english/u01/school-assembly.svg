  <rect x="332" y="162" width="6" height="18" fill="#1e293b"/>
  <rect x="342" y="162" width="6" height="18" fill="#1e293b"/>
  
  <!-- Back row -->
  <circle cx="240" cy="145" r="8" fill="#92400e"/>
  <rect x="233" y="153" width="14" height="20" rx="3" fill="#0ea5e9"/>
  <circle cx="285" cy="140" r="8" fill="#92400e"/>
  <rect x="278" y="148" width="14" height="20" rx="3" fill="#0ea5e9"/>
  <circle cx="325" cy="145" r="8" fill="#92400e"/>
  <rect x="318" y="153" width="14" height="20" rx="3" fill="#0ea5e9"/>
  
  <!-- Caption text -->
  <text x="200" y="228" font-family="sans-serif" font-size="11" fill="#444" text-anchor="middle">The headmaster speaks at morning assembly.</text>
