  <text x="90" y="135" font-family="sans-serif" font-size="11" fill="#fff" font-weight="bold">ASSEMBLY</text>
  
  <!-- Pupils in rows (simple figures) -->
  <circle cx="220" cy="120" r="10" fill="#78350f"/>
  <rect x="212" y="130" width="16" height="30" rx="3" fill="#0ea5e9"/>
  <rect x="212" y="160" width="6" height="20" fill="#1e293b"/>
  <rect x="222" y="160" width="6" height="20" fill="#1e293b"/>
  
  <circle cx="260" cy="115" r="10" fill="#78350f"/>
  <rect x="252" y="125" width="16" height="30" rx="3" fill="#0ea5e9"/>
  <rect x="252" y="155" width="6" height="22" fill="#1e293b"/>
  <rect x="262" y="155" width="6" height="22" fill="#1e293b"/>
  
  <circle cx="300" cy="118" r="10" fill="#78350f"/>
  <rect x="292" y="128" width="16" height="30" rx="3" fill="#0ea5e9"/>
  <rect x="292" y="158" width="6" height="20" fill="#1e293b"/>
  <rect x="302" y="158" width="6" height="20" fill="#1e293b"/>
  
  <circle cx="340" cy="122" r="10" fill="#78350f"/>
