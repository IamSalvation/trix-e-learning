<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" style="max-width:400px;">
  <!-- Sky and ground -->
  <rect width="400" height="240" fill="#e0f2fe"/>
  <rect x="0" y="160" width="400" height="80" fill="#d4a373"/>
  
  <!-- Stage / podium -->
  <rect x="20" y="100" width="140" height="60" rx="4" fill="#92400e"/>
  <rect x="30" y="85" width="40" height="15" rx="2" fill="#78350f"/>
