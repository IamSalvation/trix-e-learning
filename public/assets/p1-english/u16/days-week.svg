<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" style="max-width:400px;"><rect width="400" height="240" fill="#fdf4ff"/><text x="200" y="35" font-family="sans-serif" font-size="16" fill="#86198f" text-anchor="middle" font-weight="bold">Days of the Week</text><text x="200" y="70" font-family="sans-serif" font-size="12" fill="#444" text-anchor="middle">Sunday  Monday  Tuesday</text><text x="200" y="95" font-family="sans-serif" font-size="12" fill="#444" text-anchor="middle">Wednesday  Thursday</text><text x="200" y="120" font-family="sans-serif" font-size="12" fill="#444" text-anchor="middle">Friday  Saturday</text><rect x="50" y="150" width="300" height="70" rx="8" fill="#fff" stroke="#a855f7" stroke-width="2"/><text x="200" y="175" font-family="sans-serif" font-size="11" fill="#444" text-anchor="middle" font-style="italic">Solomon Grundy, born on Monday,</text><text x="200" y="195" font-family="sans-serif" font-size="11" fill="#444" text-anchor="middle" font-style="italic">Christened on Tuesday...</text></svg>
